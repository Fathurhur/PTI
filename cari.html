<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cari Dosen TITLE Rekomendasi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<div id="app-nav"></div>
<main class="page">
  <div class="mb-4"><h1 class="h3 fw-bold mb-1">Cari Dosen &amp; Rekomendasi</h1>
    <div class="text-muted">Tempel judul dan abstrak, sistem menghitung kemiripan teks dengan keahlian dan topik dosen. Dosen yang masih punya slot tampil lebih dulu.</div></div>
  <div class="row g-4">
    <div class="col-lg-5"><div class="sticky-col">
      <div class="card-x pad mb-3">
        <div class="d-flex justify-content-between"><b>Topik, judul &amp; abstrak Anda</b><a href="#" id="contoh" class="small text-decoration-none" style="color:var(--red)">Isi contoh</a></div>
        <input id="rTopik" class="form-control mt-3 mb-2" maxlength="100" placeholder="Topik (contoh: Analisis sentimen)">
        <input id="rJudul" class="form-control mb-2" maxlength="200" placeholder="Judul TA">
        <textarea id="rAbs" class="form-control" rows="8" placeholder="Abstrak (150–300 kata)"></textarea>
        <div class="mt-1 mb-3"><span class="wc" id="rWc">0 kata</span></div>
        <button class="btn btn-red w-100" id="rBtn"><i class="bi bi-calculator me-2"></i>Hitung Kecocokan</button>
      </div>
      <div class="card-x pad"><div class="sec-title"><i class="bi bi-trophy"></i>Top 5 dosen paling cocok</div>
        <div id="rHasil"><div class="empty" style="padding:24px 8px"><i class="bi bi-magic"></i>Hasil rekomendasi muncul di sini.</div></div></div>
    </div></div>
    <div class="col-lg-7">
      <div class="card-x pad mb-3">
        <div class="search"><i class="bi bi-search"></i><input id="q" class="form-control" placeholder="Cari nama dosen, keahlian, atau topik..."></div>
        <div class="d-flex flex-wrap gap-2 mt-3" id="fBidang"></div>
        <div class="d-flex flex-wrap gap-2 mt-2 align-items-center" id="fStatus"></div></div>
      <div class="d-flex align-items-center mb-2"><span class="small text-muted" id="count"></span><span class="live ms-auto">Live · <span class="live-ago">baru saja</span></span></div>
      <div id="list"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/mahasiswa.js"></script>
<script>
  bootMhs('cari');

  // list dosen + filter
  mountDosenList({
    list: $('#list'),
    search: $('#q'),
    bidang: $('#fBidang'),
    status: $('#fStatus'),
    count: $('#count')
  });

  // form rekomendasi, tampil 5 teratas
  mountRekom({
    topik: $('#rTopik'),
    judul: $('#rJudul'),
    abs: $('#rAbs'),
    wc: $('#rWc'),
    btn: $('#rBtn'),
    result: $('#rHasil'),
    contoh: $('#contoh'),
    max: 5
  });
</script></body></html>
