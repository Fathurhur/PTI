<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akses Ditolak · Dosen Pembimbing TA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head><body>
<main class="page d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card-x pad text-center" style="max-width:440px;padding:40px 28px">
    <i class="bi bi-shield-lock" style="font-size:52px;color:var(--red)"></i>
    <div class="text-muted fw-bold small mt-2">KODE 403</div>
    <h1 class="h4 fw-bold mt-1">Akses ditolak</h1>
    <p class="text-muted mb-4">Halaman ini bukan untuk peran akun Anda<span id="peranTxt"></span>. Silakan kembali ke halaman Anda atau masuk dengan akun lain.</p>
    <div class="d-grid gap-2">
      <a class="btn btn-red" id="btnKembali" href="login.html"><i class="bi bi-house me-1"></i>Kembali ke halaman saya</a>
      <button class="btn btn-ghost" id="btnGanti"><i class="bi bi-box-arrow-right me-1"></i>Keluar &amp; ganti akun</button>
    </div>
  </div>
</main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
  // halaman utama sesuai peran akun yang sedang login (dicek ke server)
  var NAMA_PERAN = { mhs: 'mahasiswa', dosen: 'dosen', koor: 'koordinator' };
  Api.get('/saya', { bolehTanpaLogin: true }).then(function (r) {
    if (!r.ok) return;
    var peran = PERAN_API[r.data.user.peran];
    document.getElementById('btnKembali').href = HALAMAN_PERAN[peran];
    document.getElementById('peranTxt').textContent = ' (' + NAMA_PERAN[peran] + ')';
  });
  document.getElementById('btnGanti').onclick = function () {
    keluar();
  };
</script></body></html>
